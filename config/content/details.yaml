sections:
  - eyebrow: "The house"
    title: "A home with a sense of place"
    description: "Timber shutters, a welcoming courtyard, and the relaxed character of a country home create a lovely first impression. Inside, the rooms feel personal and lived-in: a place to settle into, rather than simply pass through."
    image: "house/house_10.jpeg"
    alt: "The house's timber shutters and sunny courtyard"
  - eyebrow: "The setting"
    title: "Room to slow down"
    description: "The garden offers quiet corners for a morning coffee, long lunches, and unhurried afternoons beneath the trees. Beyond the home, the Charente countryside invites you to explore at your own pace."
    image: "garden/garden_2.jpeg"
    alt: "A quiet seating area beneath the garden trees"
  - eyebrow: "The dependence"
    title: "An outdoor retreat"
    description: "There is a dependence in the garden, opposite the kitchen. It is in need of some love and attention, but would make an ideal guest house."
    image: "garden/indep_1.jpeg"
    alt: "A quiet seating area beneath the garden trees"
  - eyebrow: "Heating & energy"
    title: "Energy performance"
    description: "The house has central heating. It also has a wood burner in the living room. There was once a wood burner in the kitchen, but that was taken out long before we bought the house. We did think about putting it back in, but when the heating is on and the fire is burning away in the living room, another fire in the kitchen would be far too much. The winter climate in the Charente is not that of the Arctic or even that of northern England. The central heating is provided by a diesel boiler, and this boiler also provides the house with hot water. It's efficient and powerful, but that efficiency is susceptible to diesel prices. The current situation in the world means this once cheap heating system can get expensive. The Energy Rating given to the house is because of this diesel system, frowned upon by Paris. We have two certificates, fifteen months apart (July 2023 and Nov 2024), even though they are valid for 10 years: one is graded E, and then the following one is graded G. It isn't because of the house, or the boiler, it's because of politics. Just thought we better let you know…"
    image: "energy/energy_placeholder.jpeg"
    alt: "The diesel boiler"

